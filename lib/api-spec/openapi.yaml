openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
servers:
  - url: /api
paths:
  /transit/trains/{id}:
    get:
      operationId: getTrain
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, maxLength: 180}}
      responses:
        "200":
          description: Dated Amtrak run, including unresolved observations or published schedule
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TrainDetail"}
        "404":
          description: Run unavailable or no published service on this date
  /transit/intercity/providers:
    get:
      operationId: getIntercityProviders
      responses:
        "200":
          description: Audited carrier coverage including unavailable sources
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/IntercityProvider"}}
  /transit/intercity/departures:
    get:
      operationId: getIntercityDepartures
      parameters:
        - {name: lat, in: query, required: true, schema: {type: number, minimum: -90, maximum: 90}}
        - {name: lon, in: query, required: true, schema: {type: number, minimum: -180, maximum: 180}}
        - {name: provider, in: query, schema: {type: string}}
        - {name: date, in: query, required: true, schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}}
        - {name: from, in: query, schema: {type: string, default: "00:00", pattern: '^\d{2}:\d{2}$'}}
      responses:
        "200":
          description: Location-scoped providers and dated upcoming trips
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IntercityResults"}
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthStatus"}
  /transit/stops:
    get:
      operationId: getStops
      parameters:
        - {name: cursor, in: query, schema: {type: string, maxLength: 300}}
        - {name: q, in: query, schema: {type: string}}
        - {name: mode, in: query, schema: {type: string, enum: [demo, live], default: demo}}
        - {name: type, in: query, schema: {type: string}}
        - {name: lat, in: query, schema: {type: number}}
        - {name: lon, in: query, schema: {type: number}}
        - {name: agency, in: query, schema: {type: string}}
        - {name: serviceClass, in: query, schema: {type: string, enum: [all, local, express]}}
      responses:
        "200":
          description: Nearby stops with next departures
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StopResults"}
  /transit/stops/{id}:
    get:
      operationId: getStop
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: mode, in: query, schema: {type: string, enum: [demo, live], default: demo}}
      responses:
        "200":
          description: Stop details
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Stop"}
  /transit/routes/{id}:
    get:
      operationId: getRoute
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: mode, in: query, schema: {type: string, enum: [demo, live], default: demo}}
        - {name: direction, in: query, schema: {type: string}}
      responses:
        "200":
          description: Route details
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RouteDetail"}
  /transit/sources:
    get:
      operationId: getSources
      responses:
        "200":
          description: Integration health
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/FeedSource"}}
  /transit/catalog:
    get:
      operationId: getCatalog
      parameters:
        - {name: cursor, in: query, schema: {type: string, maxLength: 300}}
        - {name: mode, in: query, schema: {type: string, enum: [demo, live], default: live}}
        - {name: q, in: query, schema: {type: string, maxLength: 180}}
        - {name: agency, in: query, schema: {type: string}}
        - {name: type, in: query, schema: {type: string}}
        - {name: serviceClass, in: query, schema: {type: string, enum: [all, local, express]}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        "200":
          description: Complete paginated catalog
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CatalogResults"}
  /transit/timetable:
    get:
      operationId: getTimetable
      parameters:
        - {name: mode, in: query, schema: {type: string, enum: [demo, live], default: live}}
        - {name: stopId, in: query, schema: {type: string}}
        - {name: routeId, in: query, schema: {type: string}}
        - {name: direction, in: query, schema: {type: string}}
        - {name: date, in: query, required: true, schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}}
        - {name: from, in: query, schema: {type: string, pattern: '^\d{2}:\d{2}$', default: "00:00"}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 40}}
      responses:
        "200":
          description: Published departures on selected service date
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TimetableResults"}
  /transit/journeys:
    post:
      operationId: planJourney
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/JourneyInput"}
      responses:
        "200":
          description: Google transit alternatives
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JourneyResults"}
  /transit/network:
    get:
      operationId: getNetwork
      parameters:
        - {name: cursor, in: query, schema: {type: string, maxLength: 300}}
        - {name: mode, in: query, schema: {type: string, enum: [demo, live], default: demo}}
        - {name: type, in: query, schema: {type: string}}
        - {name: lat, in: query, schema: {type: number}}
        - {name: lon, in: query, schema: {type: number}}
        - {name: west, in: query, schema: {type: number, minimum: -180, maximum: 180}}
        - {name: south, in: query, schema: {type: number, minimum: -90, maximum: 90}}
        - {name: east, in: query, schema: {type: number, minimum: -180, maximum: 180}}
        - {name: north, in: query, schema: {type: number, minimum: -90, maximum: 90}}
        - {name: zoom, in: query, schema: {type: number, minimum: 0, maximum: 22, default: 10}}
        - {name: agency, in: query, schema: {type: string}}
        - {name: routeId, in: query, schema: {type: string}}
        - {name: serviceClass, in: query, schema: {type: string, enum: [all, local, express]}}
      responses:
        "200":
          description: Viewport geometry, catalog stops and explicit coverage limits
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NetworkResults"}
  /transit/map-vehicles:
    get:
      operationId: getMapVehicles
      parameters:
        - {name: west, in: query, schema: {type: number, minimum: -180, maximum: 180}}
        - {name: east, in: query, schema: {type: number, minimum: -180, maximum: 180}}
        - {name: south, in: query, schema: {type: number, minimum: -90, maximum: 90}}
        - {name: north, in: query, schema: {type: number, minimum: -90, maximum: 90}}
        - {name: mode, in: query, schema: {type: string, enum: [demo, live], default: live}}
      responses:
        "200":
          description: Fresh official vehicle positions only; static geometry is never refreshed here
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/MapVehicle"}}
  /transit/alerts:
    get:
      operationId: getAlerts
      parameters:
        - {name: mode, in: query, schema: {type: string, enum: [demo, live], default: demo}}
      responses:
        "200":
          description: Current alerts
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Alert"}}
  /transit/rides:
    post:
      operationId: startRide
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RideInput"}
      responses:
        "201":
          description: Ride contribution capability; token returned once
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Ride"}
  /transit/rides/{id}:
    delete:
      operationId: endRide
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: x-ride-token, in: header, required: true, schema: {type: string}}
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthStatus"}
  /transit/rides/{id}/samples:
    post:
      operationId: submitSample
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: x-ride-token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SampleInput"}
      responses:
        "202":
          description: Sample accepted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthStatus"}
  /transit/rides/{id}/reports:
    post:
      operationId: submitReport
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: x-ride-token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReportInput"}
      responses:
        "202":
          description: Report accepted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthStatus"}
components:
  schemas:
    IntercityProvider:
      type: object
      required: [id, name, status, description, url, checkedAt, terminalService, access, aliases]
      properties:
        id: {type: string}
        name: {type: string}
        status: {type: string}
        description: {type: string}
        url: {type: string}
        checkedAt: {type: string}
        terminalService: {type: string}
        access: {type: string}
        aliases: {type: array, items: {type: string}}
        updatedAt: {type: string}
        lastError: {type: string}
    IntercityTripStop:
      type: object
      required: [id, name, sequence]
      properties:
        id: {type: string}
        name: {type: string}
        sequence: {type: integer}
        time: {type: string}
        address: {type: string}
        lat: {type: number}
        lon: {type: number}
    IntercityDeparture:
      type: object
      required: [id, tripId, routeId, providerId, providerName, stopId, stopName, time, destination, stops, sourceUrl, updatedAt, boardingNotes, serviceDate]
      properties:
        id: {type: string}
        tripId: {type: string}
        routeId: {type: string}
        providerId: {type: string}
        providerName: {type: string}
        stopId: {type: string}
        stopName: {type: string}
        time: {type: string}
        destination: {type: string}
        serviceDate: {type: string}
        boardingNotes: {type: string}
        stops: {type: array, items: {$ref: "#/components/schemas/IntercityTripStop"}}
        sourceUrl: {type: string}
        updatedAt: {type: string}
    IntercityResults:
      type: object
      required: [providers, departures, message, updatedAt, radiusMeters]
      properties:
        providers: {type: array, items: {$ref: "#/components/schemas/IntercityProvider"}}
        departures: {type: array, items: {$ref: "#/components/schemas/IntercityDeparture"}}
        message: {type: string}
        updatedAt: {type: string}
        radiusMeters: {type: integer}
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: {type: string}
    Route:
      type: object
      required: [id, name, color, type, agency]
      properties:
        transitland: {$ref: "#/components/schemas/TransitlandInfo"}
        id: {type: string}
        name: {type: string}
        color: {type: string}
        type: {type: string, enum: [subway, bus, rail, intercity]}
        agency: {type: string}
        agencyId: {type: string}
        serviceClass: {type: string, enum: [local, express]}
        longName: {type: string}
        scheduleNotes: {type: array, items: {type: string}}
        sourceUrl: {type: string}
        referenceDate: {type: string, description: Suggested historical service date for research-reference routes only}
    Arrival:
      type: object
      required: [id, routeId, routeName, color, direction, destination, minutes, source, updatedAt, status, scheduledAt]
      properties:
        id: {type: string}
        routeId: {type: string}
        routeName: {type: string}
        color: {type: string}
        direction: {type: string}
        destination: {type: string}
        minutes: {type: integer}
        source: {type: string, enum: [demo, live, community, scheduled, unavailable]}
        updatedAt: {type: string}
        status: {type: string}
        scheduledAt: {type: string}
        tripId: {type: string}
        rangeMax: {type: integer}
        confidence: {type: string}
        trainNumber: {type: string}
        runId: {type: string}
        timezone: {type: string}
        publishedAt: {type: string, description: Original scheduled departure instant for client fallback}
        expiresAt: {type: string, description: Prediction expiry based on source observation time}
    Alert:
      type: object
      required: [id, title, description, severity, routeIds, source]
      properties:
        id: {type: string}
        title: {type: string}
        description: {type: string}
        severity: {type: string}
        routeIds: {type: array, items: {type: string}}
        source: {type: string}
    Stop:
      type: object
      required: [id, name, agency, type, lat, lon, distance, walkingMinutes, routes, arrivals, alerts, accessible, updatedAt]
      properties:
        transitland: {$ref: "#/components/schemas/TransitlandInfo"}
        id: {type: string}
        name: {type: string}
        agency: {type: string}
        type: {type: string, enum: [subway, bus, rail, intercity]}
        lat: {type: number}
        lon: {type: number}
        distance: {type: number}
        walkingMinutes: {type: integer}
        routes: {type: array, items: {$ref: "#/components/schemas/Route"}}
        arrivals: {type: array, items: {$ref: "#/components/schemas/Arrival"}}
        alerts: {type: array, items: {$ref: "#/components/schemas/Alert"}}
        accessible: {type: boolean}
        updatedAt: {type: string}
        neighborhood: {type: string}
    StopResults:
      type: object
      required: [stops, mode, updatedAt, message]
      properties:
        globalCoverage: {$ref: "#/components/schemas/GlobalCoverage"}
        stops: {type: array, items: {$ref: "#/components/schemas/Stop"}}
        mode: {type: string}
        updatedAt: {type: string}
        message: {type: string}
        centerLat: {type: number}
        centerLon: {type: number}
    Vehicle:
      type: object
      required: [id, lat, lon, source, updatedAt]
      properties:
        vehicleType: {type: string, enum: [subway, bus, rail, intercity]}
        color: {type: string}
        id: {type: string}
        lat: {type: number}
        lon: {type: number}
        source: {type: string}
        updatedAt: {type: string}
        routeId: {type: string}
        agencyId: {type: string}
        routeName: {type: string}
        trainNumber: {type: string}
        destination: {type: string}
        runId: {type: string}
        expiresAt: {type: string}
    NetworkLine:
      type: object
      required: [route, shape, vehicles, shapeId]
      properties:
        shapeId: {type: string}
        route: {$ref: "#/components/schemas/Route"}
        shape: {type: array, items: {type: array, items: {type: number}}}
        vehicles: {type: array, items: {$ref: "#/components/schemas/Vehicle"}}
    MapVehicle:
      allOf:
        - {$ref: "#/components/schemas/Vehicle"}
        - type: object
          properties:
            routeId: {type: string}
    MapStop:
      type: object
      required: [id, name, lat, lon, type, routes]
      properties:
        id: {type: string}
        name: {type: string}
        lat: {type: number}
        lon: {type: number}
        type: {type: string}
        routes: {type: array, items: {$ref: "#/components/schemas/Route"}}
    NetworkResults:
      type: object
      required: [lines, stops, totalLines, totalStops, missingGeometry, truncated, busDetailZoom, stopsZoom, generation, message]
      properties:
        globalCoverage: {$ref: "#/components/schemas/GlobalCoverage"}
        lines: {type: array, items: {$ref: "#/components/schemas/NetworkLine"}}
        stops: {type: array, items: {$ref: "#/components/schemas/MapStop"}}
        totalLines: {type: integer}
        totalStops: {type: integer}
        missingGeometry: {type: array, items: {$ref: "#/components/schemas/Route"}}
        truncated: {type: boolean}
        busDetailZoom: {type: integer}
        stopsZoom: {type: integer}
        generation: {type: string}
        message: {type: string}
    RouteDetail:
      type: object
      required: [route, stops, shape, vehicles, alerts, directions]
      properties:
        route: {$ref: "#/components/schemas/Route"}
        stops: {type: array, items: {$ref: "#/components/schemas/Stop"}}
        shape: {type: array, items: {type: array, items: {type: number}}}
        vehicles: {type: array, items: {$ref: "#/components/schemas/Vehicle"}}
        alerts: {type: array, items: {$ref: "#/components/schemas/Alert"}}
        directions: {type: array, items: {type: string}}
        timetableStops: {type: array, items: {$ref: "#/components/schemas/IntercityTripStop"}}
    FeedSource:
      type: object
      required: [id, agency, status, description, url, updatedAt]
      properties:
        id: {type: string}
        agency: {type: string}
        status: {type: string}
        description: {type: string}
        url: {type: string}
        updatedAt: {type: ["string", "null"]}
        type: {type: string}
        routeCount: {type: integer}
        stopCount: {type: integer}
        serviceStart: {type: string}
        serviceEnd: {type: string}
        importedAt: {type: string}
        sourceUrl: {type: string}
        lastError: {type: string}
    CatalogResults:
      type: object
      required: [routes, stops, totalRoutes, totalStops, offset, limit]
      properties:
        globalCoverage: {$ref: "#/components/schemas/GlobalCoverage"}
        routes: {type: array, items: {$ref: "#/components/schemas/Route"}}
        stops: {type: array, items: {$ref: "#/components/schemas/Stop"}}
        totalRoutes: {type: integer}
        totalStops: {type: integer}
        offset: {type: integer}
        limit: {type: integer}
    TimetableDeparture:
      type: object
      required: [id, tripId, stopId, stopName, routeId, routeName, destination, direction, time]
      properties:
        id: {type: string}
        tripId: {type: string}
        stopId: {type: string}
        stopName: {type: string}
        routeId: {type: string}
        routeName: {type: string}
        destination: {type: string}
        direction: {type: string}
        time: {type: string}
        trainNumber: {type: string}
        runId: {type: string}
        timezone: {type: string}
    TrainCall:
      type: object
      required: [code, name, sequence, timezone, status, scheduledArrival, scheduledDeparture, estimatedArrival, estimatedDeparture, actualArrival, actualDeparture]
      properties:
        code: {type: string}
        name: {type: string}
        sequence: {type: integer}
        timezone: {type: ["string", "null"]}
        status: {type: string}
        scheduledArrival: {type: ["string", "null"]}
        scheduledDeparture: {type: ["string", "null"]}
        estimatedArrival: {type: ["string", "null"]}
        estimatedDeparture: {type: ["string", "null"]}
        actualArrival: {type: ["string", "null"]}
        actualDeparture: {type: ["string", "null"]}
    TrainDetail:
      type: object
      required: [id, trainNumber, routeName, destination, serviceDate, source, updatedAt, expiresAt, state, lat, lon, calls, matched, message]
      properties:
        id: {type: string}
        trainNumber: {type: string}
        routeName: {type: string}
        destination: {type: string}
        serviceDate: {type: string}
        source: {type: string}
        updatedAt: {type: ["string", "null"]}
        expiresAt: {type: ["string", "null"]}
        state: {type: string}
        lat: {type: ["number", "null"]}
        lon: {type: ["number", "null"]}
        calls: {type: array, items: {$ref: "#/components/schemas/TrainCall"}}
        routeId: {type: string}
        tripId: {type: string}
        matched: {type: boolean}
        message: {type: string}
    TimetableResults:
      type: object
      required: [departures, total, offset, limit, date, message]
      properties:
        timezone: {type: string}
        globalCoverage: {$ref: "#/components/schemas/GlobalCoverage"}
        departures: {type: array, items: {$ref: "#/components/schemas/TimetableDeparture"}}
        total: {type: integer}
        offset: {type: integer}
        limit: {type: integer}
        date: {type: string}
        message: {type: string}
    TransitlandInfo:
      type: object
      required: [feedId, fetchedAt, license, attribution, url]
      properties:
        feedId: {type: string}
        fetchedAt: {type: string}
        license: {type: string}
        attribution: {type: string}
        url: {type: string}
        timezone: {type: string}
        platform: {type: string}
        parentStation: {type: string}
        accessibility: {type: string}
        modeDetail: {type: string}
        notes: {type: array, items: {type: string}}
    GlobalCoverage:
      type: object
      required: [status, message, hasMore]
      properties:
        status: {type: string}
        message: {type: string}
        hasMore: {type: boolean}
        cursor: {type: string}
        used: {type: integer}
        limit: {type: integer}
    JourneyInput:
      type: object
      required: [origin, destination, timeType]
      properties:
        origin: {type: string, minLength: 2, maxLength: 200}
        destination: {type: string, minLength: 2, maxLength: 200}
        timeType: {type: string, enum: [departure, arrival]}
        time: {type: string, format: date-time}
        modes: {type: array, maxItems: 5, items: {type: string, enum: [BUS, SUBWAY, TRAIN, LIGHT_RAIL, RAIL]}}
    JourneyPoint:
      type: object
      required: [lat, lon]
      properties:
        lat: {type: number}
        lon: {type: number}
    JourneyStep:
      type: object
      required: [mode, instruction, durationSeconds]
      properties:
        mode: {type: string}
        instruction: {type: string}
        durationSeconds: {type: number}
        line: {type: string}
        agency: {type: string}
        agencies: {type: array, items: {$ref: "#/components/schemas/JourneyAgency"}}
        departureStop: {type: string}
        arrivalStop: {type: string}
        departureTime: {type: string}
        arrivalTime: {type: string}
        start: {$ref: "#/components/schemas/JourneyPoint"}
        end: {$ref: "#/components/schemas/JourneyPoint"}
    JourneyAgency:
      type: object
      required: [name]
      properties:
        name: {type: string}
        url: {type: string}
    Journey:
      type: object
      required: [id, durationSeconds, distanceMeters, shape, steps]
      properties:
        id: {type: string}
        durationSeconds: {type: number}
        distanceMeters: {type: number}
        shape: {type: array, items: {type: array, items: {type: number}}}
        steps: {type: array, items: {$ref: "#/components/schemas/JourneyStep"}}
    JourneyResults:
      type: object
      required: [journeys, message, provider, configured]
      properties:
        journeys: {type: array, items: {$ref: "#/components/schemas/Journey"}}
        message: {type: string}
        provider: {type: string}
        configured: {type: boolean}
    RideInput:
      type: object
      required: [agency, routeId, direction, stopId, consent, mode]
      properties:
        agency: {type: string}
        routeId: {type: string}
        direction: {type: string}
        stopId: {type: string}
        tripId: {type: string}
        consent: {type: boolean}
        mode: {type: string, enum: [demo, live]}
    Ride:
      type: object
      required: [id, token, expiresAt, status]
      properties:
        id: {type: string}
        token: {type: string}
        expiresAt: {type: string}
